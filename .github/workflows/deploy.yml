# Refreshes the data and publishes the site to this repository's GitHub Pages
# (gh-pages branch). Runs every day at 01:00 Italian time, on every push to the
# default branch, and on demand (Actions tab -> "Refresh data and deploy" -> Run workflow).
# The same file serves the live site (hippocampushub/build, www.hippocampushub.eu/build/)
# and the test site (hippocampushub/build-dev, www.hippocampushub.eu/build-dev/).
name: Refresh data and deploy

on:
  # GitHub schedules are in UTC: 01:00 in Rome is 23:00 UTC in summer (CEST)
  # and 00:00 UTC in winter (CET). Both run; the "when" job keeps the right one.
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 0 * * *"
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write  # commit the refreshed data and push the gh-pages branch

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Public path of the site: /build/ for the live one, /build-dev/ for the test site
  HH_BASE: ${{ github.repository == 'hippocampushub/build' && '/build/' || '/build-dev/' }}
  # "1" shows the "test version" banner and keeps the site out of search engines; empty for the live site
  VITE_STAGING: ${{ github.repository == 'hippocampushub/build' && '' || '1' }}

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          zone=$(TZ=Europe/Rome date +%Z)   # CEST in summer, CET in winter
          if [ "${{ github.event_name }}" != "schedule" ] \
             || { [ "$CRON" = "0 23 * * *" ] && [ "$zone" = "CEST" ]; } \
             || { [ "$CRON" = "0 0 * * *" ] && [ "$zone" = "CET" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 01:00 in Rome ($zone) for schedule '$CRON': skipping"
          fi

  deploy:
    needs: when
    if: needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # A failing source keeps its previous files (committed in backend/data), so the
      # site is still published; the run is marked as failed at the end.
      - name: Fetch data
        id: fetch
        if: github.event_name != 'push'
        continue-on-error: true
        working-directory: backend
        run: python fetch_all.py

      - name: Fetch ModelDB file lists
        id: modfiles
        if: github.event_name != 'push'
        continue-on-error: true
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # --allow-zip: the few models not mirrored on GitHub yet get their list from the ModelDB zip
        run: python fetch_model_files.py --allow-zip

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898211+github-actions[bot]@users.noreply.github.com"
          git add backend/data backend/cache
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh data"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build site
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Browsers may keep the previous index.html for a few minutes (GitHub Pages
      # caches it for 10 min); it points to the previous script and stylesheet, so
      # those, and the files they use, are kept next to the new ones. Otherwise such
      # visitors get a blank page right after a deploy.
      - name: Keep the previous version's files
        working-directory: frontend/dist
        run: |
          if git clone -q --depth 1 --branch gh-pages "https://github.com/${{ github.repository }}.git" /tmp/previous; then
            cd /tmp/previous
            main=$(grep -o 'assets/[^"]*\.\(js\|css\)' index.html | sort -u)
            used=$(cat $main | grep -o 'assets/[A-Za-z0-9_.-]*\.[a-z0-9]*' | sort -u)
            cd - > /dev/null
            for f in $main $used; do
              [ -e "$f" ] || [ ! -e "/tmp/previous/$f" ] || cp "/tmp/previous/$f" "$f"
            done
          fi

      - name: Publish to gh-pages
        working-directory: frontend/dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898211+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Report fetch failures
        if: steps.fetch.outcome == 'failure' || steps.modfiles.outcome == 'failure'
        run: |
          echo "::error::Some sources could not be fetched; the site was published with their previous data. See the Fetch steps above."
          exit 1
